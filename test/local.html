<style>
/* Layout: one column, phone-first, sticky header, fixed bottom nav. Dark by choice: black and charcoal surfaces, electric blue for the active path, lime only for things completed. */
:root {

*/

    highPulley: [{ t: 'post', x: 262 }, { t: 'pulley', x: 252, y: 42 }],
    highPulleyLow: [{ t: 'post', x: 262 }, { t: 'pulley', x: 252, y: 70 }],

    midPulley: [{ t: 'post', x: 262 }, { t: 'pulley', x: 254, y: 150 }, { t: 'seat', x: 118, y: 170, w: 70 }],
    pulldown: [{ t: 'post', x: 262 }, { t: 'pulley', x: 252, y: 42 }, { t: 'seat', x: 118, y: 170, w: 70 }],
    backPulleyHigh: [{ t: 'post', x: 38 }, { t: 'pulley', x: 48, y: 36 }],
    backPulleyLow: [{ t: 'post', x: 38 }, { t: 'pulley', x: 48, y: 192 }],
    pullup: [{ t: 'post', x: 100, y1: 40 }, { t: 'post', x: 200, y1: 40 }, { t: 'bar', x1: 100, y1: 40, x2: 200, y2: 40 }],
    hang: [{ t: 'post', x: 100, y1: 28 }, { t: 'post', x: 200, y1: 28 }, { t: 'bar', x1: 100, y1: 28, x2: 200, y2: 28 }],

const Stats = {

  history(exId) {
